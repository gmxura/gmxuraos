        .single();
      
      if (error && error.code !== "PGRST116") throw error;
      
      if (data && data.data) {
        console.log("[Cloud] Dados da nuvem encontrados, restaurando...");
        // Restore all localStorage keys from cloud
        const cloudData = data.data;
        Object.keys(cloudData).forEach(k => {
          try {
            localStorage.setItem(k, typeof cloudData[k] === "string" ? cloudData[k] : JSON.stringify(cloudData[k]));
          } catch(e) {}
        });
        updateCloudBadge("saved", "☁️ Nuvem sincronizada");
        // Reload to apply
        setTimeout(() => location.reload(), 800);
        return true;
      } else {
        updateCloudBadge("saved", "☁️ Nuvem pronta");
        console.log("[Cloud] Nenhum dado na nuvem ainda");
      }
    } catch (e) {
      console.error("[Cloud] Erro ao carregar:", e);
      updateCloudBadge("error", "☁️ Erro nuvem");
    }
    return false;
  }

  async function saveToCloud() {
    try {
      updateCloudBadge("saving", "☁️ Salvando...");
      // Collect all gmxura-related localStorage
      const allData = {};
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (!k) continue;
        // Save everything that looks like app data (avoid supabase keys)
        if (k.startsWith("sb-")) continue;
        allData[k] = localStorage.getItem(k);
      }
      
      const { error } = await supabaseClient
        .from("gmxura_os_data")
        .upsert({
          user_id: CLOUD_USER_ID,
          data: allData,
          updated_at: new Date().toISOString()
        }, { onConflict: "user_id" });
      
      if (error) throw error;
      updateCloudBadge("saved", "☁️ Salvo na nuvem");
      console.log("[Cloud] Salvo com sucesso");
    } catch (e) {
      console.error("[Cloud] Erro ao salvar:", e);
      updateCloudBadge("error", "☁️ Erro ao salvar");
    }
  }

  function debouncedSave() {
    if (saveTimeout) clearTimeout(saveTimeout);
    updateCloudBadge("saving", "☁️ Salvando...");
    saveTimeout = setTimeout(saveToCloud, 1500);
  }

  // Hook into localStorage changes
  const originalSetItem = localStorage.setItem;
  localStorage.setItem = function(key, value) {
    originalSetItem.apply(this, arguments);
    if (!key.startsWith("sb-")) {
      debouncedSave();
    }
  };

  // Auto load on start
  window.addEventListener("DOMContentLoaded", () => {
    // Inject badge into header if exists, otherwise create floating
    const injectBadge = () => {
      let header = document.querySelector("header") || document.querySelector("[class*=header]") || document.body;
      let badge = document.getElementById("cloud-badge");
      if (!badge) {
        badge = document.createElement("div");
        badge.id = "cloud-badge";
        badge.style.cssText = "position:fixed;top:12px;right:12px;z-index:9999;font-size:11px;font-weight:600;padding:6px 12px;border-radius:999px;background:rgba(124,58,237,0.12);color:#7C3AED;border:1px solid rgba(124,58,237,0.15);backdrop-filter:blur(12px);font-family:ui-sans-serif;transition:all 0.3s;";
        badge.textContent = "☁️ Conectando...";
        document.body.appendChild(badge);
      }
    };
    injectBadge();
    loadFromCloud();
    
    // Save every 30s as backup
    setInterval(() => {
      if (navigator.onLine) saveToCloud();
    }, 30000);
  });

  window.addEventListener("online", () => saveToCloud());
  console.log("[Cloud] Gmxura OS Cloud Sync iniciado");
  </script>
